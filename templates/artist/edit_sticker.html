{% extends "base.html" %}

{% block title %}Edit Sticker - StickerNest{% endblock %}

{% block content %}

<div class="artist-dashboard">

    <h1>Edit Sticker</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div>
            <label for="name">Sticker Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ sticker.name }}"
                required
            >
        </div>

        <div>
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="4"
            >{{ sticker.description or "" }}</textarea>
        </div>

        <div>
            <label for="price">Price</label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ sticker.price }}"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div>
            <label for="category">Category</label>

            <select
                id="category"
                name="category_id"
                required
            >

                {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == sticker.category_id %}
                            selected
                        {% endif %}
                    >
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>
        </div>

        <div>
            <label for="image">Change Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >
        </div>

        <button type="submit" class="artist-btn">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
