{% extends "base.html" %}

{% block title %}Edit Sticker - StickerNest{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/artists.css') }}">
{% endblock %}

{% block content %}

<div class="artist-form-page">

    <a href="{{ url_for('artist_dashboard') }}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to dashboard
    </a>

    <div class="artist-form-header">
        <h1>Edit Sticker</h1>
        <p>Update the details or artwork for {{ sticker.name }}.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="artist-sticker-form">

        <div class="form-field">
            <label for="image">Sticker Image</label>

            <div class="current-sticker-image">
                <img
                    src="{{ url_for('static', filename='uploads/' + sticker.image) }}"
                    alt="{{ sticker.name }}"
                >
                <p>Current image. Upload a new file to replace it.</p>
            </div>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/png,image/jpeg,image/webp"
            >
        </div>

        <div class="form-field">
            <label for="name">Sticker Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ sticker.name }}"
                required
            >
        </div>

        <div class="form-field">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
            >{{ sticker.description or "" }}</textarea>
        </div>

        <div class="form-field">
            <label for="price">Price (Rs.)</label>
            <input
                type="number"
                id="price"
                name="price"
                value="{{ sticker.price }}"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div class="form-field">
            <label for="category">Category</label>
            <select id="category" name="category_id" required>
                {% for category in categories %}
                    <option
                        value="{{ category.id }}"
                        {% if category.id == sticker.category_id %}selected{% endif %}
                    >
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="artist-btn">
                Save Changes
            </button>

            <a href="{{ url_for('artist_dashboard') }}" class="cancel-btn">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
