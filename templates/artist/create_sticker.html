{% extends "base.html" %}

{% block title %}Create Sticker - StickerNest{% endblock %}

{% block content %}

<div class="artist-dashboard">

    <h1>Create Sticker</h1>
    <p>Add a new sticker to your collection.</p>

    <form method="POST"
          action="{{ url_for('create_sticker') }}"
          enctype="multipart/form-data">

        <div>
            <label for="name">Sticker Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >
        </div>

        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
            ></textarea>
        </div>

        <div>
            <label for="price">Price</label>
            <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div>
            <label for="category">Category</label>

            <select id="category" name="category_id" required>
                <option value="">Select a category</option>

                {% for category in categories %}
                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div>
            <label for="image">Sticker Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
                required
            >
        </div>

        <button type="submit" class="artist-btn">
            Publish Sticker
        </button>

    </form>

</div>

{% endblock %}
