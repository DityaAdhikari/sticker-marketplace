{% extends 'base.html' %}

{% block title %}Login - StickerNest{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<main class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Account Login</h2>
    <p class="auth-subtitle">Welcome back to StickerNest</p>
     

     

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit-btn">Login</button>
    </form>

    <p class="auth-footer-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
  </div>
</main>
{% endblock %}
