<section class="header">
  <header class="navbar">
    <!-- Logo -->
    <div class="nav-logo">
      <div class="logo-text">
        Sticker<span>Nest</span> 
        <i class="fa-solid fa-hand-holding-heart logo-icon"></i>
      </div>
      <div class="logo-subtext">Stickers from the street of KTM artist</div>
    </div>

    <!-- Search Bar -->
    <form class="nav-search" action="{{ url_for('search') }}" method="GET">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" name="q" placeholder="Search stickers, artists, categories...">
    </form>

    <!-- Navigation Links -->
    <nav class="nav-links">
      <a href="{{ url_for('home') }}" class="nav-item {{ 'active' if request.endpoint == 'home' }}">Home</a>
      
      <!-- Shop Link (Only active when endpoint is shop AND no category parameter is selected) -->
      <a href="{{ url_for('shop') }}" class="nav-item {{ 'active' if request.endpoint == 'shop' and not request.args.get('category') }}">Shop</a>
      
      <!-- Categories Dropdown (Active when a category URL parameter exists) -->
      <div class="nav-item dropdown {{ 'active' if request.args.get('category') }}">
        <span>Categories <i class="fa-solid fa-chevron-down dropdown-arrow"></i></span>
        <div class="dropdown-menu">
          <div class="dropdown-menu-inner">
            {% for category in nav_categories %}
            <a href="{{ url_for('shop', category=category.name) }}" 
               class="{{ 'active' if request.args.get('category') == category.name }}">
              {{ category.name }}
            </a>
            {% endfor %}
          </div>
        </div>
      </div>

      <a href="{{ url_for('artists') }}" class="nav-item {{ 'active' if request.endpoint == 'artists' }}">Artists</a>
      <a href="{{ url_for('about') }}" class="nav-item {{ 'active' if request.endpoint == 'about' }}">About</a>
      <a href="{{ url_for('contact') }}" class="nav-item {{ 'active' if request.endpoint == 'contact' }}">Contact</a>
    </nav>

    <div class="nav-divider"></div>

    <!-- Action Buttons -->
    <div class="nav-actions">
      <div class="action-item" id="wishlist-btn">
        <div class="icon-wrapper">
          <i class="fa-regular fa-heart"></i>
          <span class="badge">0</span>
        </div>
        <span class="action-label">Wishlist</span>
      </div>

      <div class="action-item" id="cart-btn">
        <div class="icon-wrapper cart-icon-bg">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="badge">0</span>
        </div>
        <span class="action-label">Cart</span>
      </div>
        {% if session.get("user_id") %}

    <span class="action-label">Hi, {{ session.get("user_name") }}</span>

    <a href="{{ url_for('logout') }}" class="action-item">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span class="action-label">Logout</span>
    </a>

{% else %}

    <a href="{{ url_for('login') }}" class="action-item">
        <i class="fa-regular fa-user"></i>
        <span class="action-label">Login</span>
    </a>

{% endif %}

      <div class="mobile-menu-toggle" id="mobile-toggle">
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>
  </header>
</section>
