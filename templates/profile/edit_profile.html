{% extends "base.html" %}

{% block title %}Edit Profile - StickerNest{% endblock %}

{% block content %}

<div class="edit-profile-card">

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ user.name }}"
            required
        >

        <label>Bio</label>
        <textarea name="bio" rows="4">{{ user.bio or "" }}</textarea>

        <label>Location</label>
        <input
            type="text"
            name="location"
            value="{{ user.location or "" }}"
        >
        <label>Profile Picture</label>

        <input
         type="file"
        name="profile_image"
        accept="image/png,image/jpeg,image/jpg"
        >
         
        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
